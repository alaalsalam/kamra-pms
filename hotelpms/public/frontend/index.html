<script>

  // ---- route sync (so the workspace route bar follows in-preview navigation, even cross-origin) ----
  function curPath(){ return (location.pathname + location.search + location.hash).replace(/[?&]_preview=\d+/, '').replace(/[?&]$/, ''); }

  // ---- element inspector ----
  function ensureOverlay(){
    if (overlay) return;
    overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;z-index:2147483646;pointer-events:none;border:2px solid #6366f1;background:rgba(99,102,241,0.15);border-radius:3px;display:none;';

    document.documentElement.appendChild(overlay);
    document.documentElement.appendChild(label);

  function hideOverlay(){ if(overlay) overlay.style.display='none'; if(label) label.style.display='none'; }

  function fiberOf(el){ for (var k in el){ if (k.indexOf('__reactFiber$')===0 || k.indexOf('__reactInternalInstance$')===0) return el[k]; } return null; }

    var out = [], f = fiberOf(el), guard = 0;
    while (f && guard < 300){
      var n = compName(f.type);
      if (n && n.length > 1 && !/^[a-z]$/.test(n) && out.indexOf(n) < 0){ out.push(n); if (out.length >= 3) break; }
      f = f.return; guard++;

    return out;
  }
  function nearestSource(el){
    var n = el, d = 0;
    while (n && n.nodeType === 1 && d < 18){
      var s = n.getAttribute('data-lov-id') || n.getAttribute('data-component-path') || n.getAttribute('data-bf-source');
      if (s){ var line = n.getAttribute('data-component-line') || ''; return s + (line ? (':' + line) : ''); }
      n = n.parentNode; d++;

  }
  function nearestLandmark(el){
    var TAGS = {SECTION:1,ARTICLE:1,NAV:1,HEADER:1,FOOTER:1,MAIN:1,ASIDE:1,FORM:1,DIALOG:1,TABLE:1};
    var n = el, d = 0;
    while (n && n.nodeType === 1 && d < 18){
      if (TAGS[n.tagName] || n.getAttribute('role')){
        var lbl = n.getAttribute('aria-label') || '';
        return n.tagName.toLowerCase() + (n.getAttribute('role') ? ('[role=' + n.getAttribute('role') + ']') : '') + (lbl ? (' "' + lbl.slice(0,60) + '"') : '');
      }
      n = n.parentNode; d++;
    }
    return '';
  }
  function nearestHeading(el){
    var n = el, d = 0;
    while (n && n.nodeType === 1 && d < 6){
      var h = n.querySelector && n.querySelector('h1,h2,h3,h4,h5,h6');
      if (h && (h.innerText || h.textContent)) return (h.innerText || h.textContent).replace(/\s+/g,' ').trim().slice(0,80);
      n = n.parentNode; d++;

    return '';
  }
  function nameFor(el){
    var dc = (el.getAttribute('data-component-name') || '').trim();
    if (dc) return dc;
    var c = componentChain(el); if (c[0]) return c[0];
    var lov = (el.getAttribute('data-lov-id') || '').trim(); if (lov) return lov.split('/').pop();
    return el.tagName.toLowerCase() + (el.id ? '#' + el.id : '');
  }
  function dataAttrs(el){
    var out = [];
    if (el.attributes){ for (var i=0;i<el.attributes.length;i++){ var a = el.attributes[i]; if (a.name.indexOf('data-')===0 || a.name==='role' || a.name==='aria-label' || a.name==='name' || a.name==='type'){ out.push(a.name + '=' + (a.value||'').slice(0,40)); } } }
    return out.join(' ').slice(0,300);
  }
  function cssPath(el){
    var parts = [], node = el, depth = 0;
    while (node && node.nodeType === 1 && depth < 6 && node.tagName.toLowerCase() !== 'html'){
      var sel = node.tagName.toLowerCase();
      if (node.id){ parts.unshift(sel + '#' + node.id); break; }
      var p = node.parentNode;
      if (p){ var sib = Array.prototype.filter.call(p.children, function(c){ return c.tagName === node.tagName; }); if (sib.length > 1) sel += ':nth-of-type(' + (Array.prototype.indexOf.call(sib, node) + 1) + ')'; }
      parts.unshift(sel); node = node.parentNode; depth++;

    return parts.join(' > ');
  }
  function xpath(el){
    if (el.id) return '//*[@id="' + el.id + '"]';
    var parts = [], n = el;
    while (n && n.nodeType === 1 && n.tagName.toLowerCase() !== 'html'){
      var i = 1, sib = n.previousElementSibling;

  }
  function descriptor(el){
    var txt = ''; try { txt = (el.innerText || el.textContent || '').replace(/\s+/g,' ').trim().slice(0,300); } catch(_){}
    var oh = ''; try { oh = (el.outerHTML || '').slice(0,1500); } catch(_){}
    return {
      url: location.href,
      route: location.pathname + (location.hash || ''),
      title: document.title || '',
      tag: el.tagName.toLowerCase(),

  function position(el){
    var r = el.getBoundingClientRect();
    overlay.style.display='block'; overlay.style.left=r.left+'px'; overlay.style.top=r.top+'px'; overlay.style.width=r.width+'px'; overlay.style.height=r.height+'px';
    label.style.display='block'; label.textContent = nameFor(el);
    var ly = r.top - 22; if (ly < 2) ly = r.top + 4;
    label.style.left = Math.max(2, r.left) + 'px'; label.style.top = ly + 'px';
  }
  function onMove(e){ if (!active) return; var el = e.target; if (!el || el === overlay || el === label) return; hovered = el; ensureOverlay(); position(el); }

  document.addEventListener('click', onClick, true);
  document.addEventListener('keydown', onKey, true);
  window.addEventListener('scroll', function(){ if (active && hovered) position(hovered); }, true);
  window.addEventListener('message', function(e){
